repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' } // Needed for FTC Dashboard & Road Runner
    maven { url = 'https://repo.dairy.foundation/releases/' } // Needed for Pedro Pathing
    maven { url = 'https://mymaven.bylazar.com/releases' } // Needed for Panels
    maven { url = 'https://jitpack.io' } // JitPack for FTC libraries
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.acmerobotics.dashboard:dashboard:0.6.0'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'

    // Road Runner 1.0
    implementation 'com.acmerobotics.roadrunner:core:1.0.1'
    implementation 'com.acmerobotics.roadrunner:actions:1.0.1'
    implementation 'com.acmerobotics.roadrunner:ftc:0.1.25'

    // Pedro Pathing (v3.0.0+)
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.2'
    implementation 'com.pedropathing:ivy:1.0.0'
}